name: telur-finance

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telur_finance}
      POSTGRES_USER: ${POSTGRES_USER:-telur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telur_dev}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Catatan: DJANGO_SETTINGS_MODULE sengaja tidak di-hardcode di sini.
    # manage.py memakai config.settings.dev secara default, sedangkan pytest
    # memakai config.settings.test dari pyproject.toml. Set env var ini di
    # .env/command hanya untuk produksi (config.settings.prod).
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-telur_finance}
      POSTGRES_USER: ${POSTGRES_USER:-telur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telur_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TZ: Asia/Jakarta
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
