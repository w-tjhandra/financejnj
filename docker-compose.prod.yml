name: telur-finance

services:
  volume-permissions:
    image: busybox:1.36
    user: "0:0"
    restart: "no"
    network_mode: none
    command:
      - sh
      - -c
      - chown -R 1000:1000 /static /media
    volumes:
      - static-data:/static
      - media-data:/media

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DJANGO_STATIC_ROOT: /static
      DJANGO_MEDIA_ROOT: /media
      TZ: Asia/Jakarta
    volumes:
      - static-data:/static
      - media-data:/media
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    expose:
      - "8000"
    command:
      - sh
      - -c
      - python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 60 --access-logfile - --error-logfile -
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; host=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); request=urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host':host,'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - telur-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  period-locker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      TZ: Asia/Jakarta
    command:
      - python
      - manage.py
      - auto_lock_previous_period
    depends_on:
      app:
        condition: service_healthy
    networks:
      - telur-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static-data:/static:ro
      - media-data:/media:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - telur-network

volumes:
  static-data:
  media-data:

networks:
  telur-network:
    driver: bridge
