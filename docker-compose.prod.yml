version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: telur-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backup:/backup
    networks:
      - telur-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: telur-finance-app
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - MEDIA_ROOT=/media
      - STATIC_ROOT=/static
    volumes:
      - media-data:/media
      - static-data:/static
    depends_on:
      db:
        condition: service_healthy
    networks:
      - telur-network

  caddy:
    image: caddy:2-alpine
    container_name: telur-finance-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      - static-data:/static
      - media-data:/media
    depends_on:
      - app
    networks:
      - telur-network

volumes:
  db-data:
  media-data:
  static-data:
  caddy-data:
  caddy-config:

networks:
  telur-network:
    driver: bridge