{% comment %}Indikator progres wizard 5 langkah.{% endcomment %}
<ol class="grid grid-cols-5 gap-1 sm:gap-2" aria-label="Langkah setup">
  {% for item in stepper %}
    <li class="flex flex-col items-center gap-1 text-center">
      <span class="flex h-8 w-8 items-center justify-center rounded-full text-xs font-semibold
        {% if item.state == 'done' %}bg-emerald-700 text-white
        {% elif item.state == 'current' %}bg-emerald-50 text-emerald-800 ring-2 ring-emerald-600
        {% else %}bg-slate-100 text-slate-500{% endif %}"
        {% if item.state == 'current' %}aria-current="step"{% endif %}>
        {% if item.state == 'done' %}✓{% else %}{{ item.number }}{% endif %}
      </span>
      <span class="text-[11px] leading-tight {% if item.state == 'current' %}font-semibold text-emerald-800{% else %}text-slate-500{% endif %}">
        {{ item.label }}
      </span>
    </li>
  {% endfor %}
</ol>
