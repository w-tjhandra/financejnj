{% comment %}Navigasi utama. Satu daftar, tampil vertikal di desktop dan horizontal di HP.{% endcomment %}
<nav class="border-b border-slate-200 bg-white lg:fixed lg:inset-y-0 lg:left-0 lg:w-60 lg:border-b-0 lg:border-r" aria-label="Navigasi utama">
  <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-1 px-4 py-2 lg:h-full lg:flex-col lg:items-stretch lg:justify-start lg:p-3">
    <a href="{% url 'dashboard' %}" class="flex min-h-11 items-center gap-2 text-base font-semibold text-emerald-800">
      <span aria-hidden="true" class="grid h-8 w-8 place-items-center rounded-lg bg-emerald-700 text-sm font-bold text-white">TF</span>
      Telur Finance
    </a>

    <ul class="flex items-center gap-1 overflow-x-auto lg:mt-4 lg:flex-col lg:items-stretch lg:gap-1">
      <li>
        <a href="{% url 'dashboard' %}" class="nav-link" {% if request.resolver_match.url_name == 'dashboard' %}aria-current="page"{% endif %}>
          Dashboard
        </a>
      </li>
    </ul>

    <div class="flex items-center gap-2 lg:mt-auto lg:flex-col lg:items-stretch lg:border-t lg:border-slate-200 lg:pt-3">
      <span class="hidden px-3 text-sm text-slate-500 lg:block">{{ user.get_full_name|default:user.username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="nav-link w-full text-left">Keluar</button>
      </form>
    </div>
  </div>
</nav>
